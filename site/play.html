<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Versjon 4, datadrevet (spec 006): play.html?case=<id> leser saken fra cases/<id>.json og huset fra floorplans/.
   Kartet står fast, og feltet under bytter mellom fire moduser (intro, investigate, accuse, ending).
   Oppførselen er den samme som i site/003.html. Bare dataene kommer et annet sted fra. */
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --ink:#15202A; --muted:#56636E; --line:#D2D9DE;
  --green:#2E8654; --yellow:#C08E14; --red:#B04536; --on-mark:#FFFFFF; --glow:rgba(46,134,84,.4);
  --p-a:#9A5B2E; --p-b:#467A33; --p-c:#8E3F78; --p-d:#36598C; --p-e:#1F7A78; --p-f:#5D6470; --on-token:#FFFFFF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ar:1; --times:3; --tray-cols:4; --pick-s:4; --pick-r:4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161B; --surface:#172027; --ink:#E7ECEF; --muted:#96A3AD; --line:#29343D;
  --green:#4DB47A; --yellow:#DDAE3C; --red:#E0796A; --on-mark:#10161B; --glow:rgba(77,180,122,.45);
  --p-a:#E0A06E; --p-b:#8CC775; --p-c:#D98CC4; --p-d:#86A9E0; --p-e:#6CCFC9; --p-f:#B4BBC6; --on-token:#10161B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10161B; --surface:#172027; --ink:#E7ECEF; --muted:#96A3AD; --line:#29343D;
  --green:#4DB47A; --yellow:#DDAE3C; --red:#E0796A; --on-mark:#10161B; --glow:rgba(77,180,122,.45);
  --p-a:#E0A06E; --p-b:#8CC775; --p-c:#D98CC4; --p-d:#86A9E0; --p-e:#6CCFC9; --p-f:#B4BBC6; --on-token:#10161B; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* Toppstripe */
.top{display:flex;align-items:center;gap:8px;min-height:36px}
.top h1{font-size:1.15rem;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font:500 .78rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:700 1rem var(--f-display);cursor:pointer}
.pill{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 .78rem var(--f-mono);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.app:not([data-mode="investigate"]) #notesBtn,.app:not([data-mode="investigate"]) #helpBtn{display:none}

/* Lasting og feil: bare en kort melding */
.app[data-mode="loading"] > :not(.top),.app[data-mode="error"] > :not(.top):not(#pErr){display:none}
.app[data-mode="loading"] .status,.app[data-mode="error"] .status{display:none}

/* Timer */
.hours{display:grid;grid-template-columns:repeat(var(--times),1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:3px}
.hour{font:500 .85rem var(--f-mono);padding:7px 0;border:0;border-radius:7px;background:transparent;cursor:pointer;display:flex;justify-content:center;align-items:baseline;gap:6px}
.hour small{font-size:.7rem;opacity:.65}
.hour[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hour:disabled{cursor:default}
.hours.many .hour{gap:3px;font-size:.78rem}
.hours.many .hour small{font-size:.62rem}

/* Kart */
.map{display:flex;justify-content:center;flex:0 0 auto}
.map svg{display:block;width:100%;max-width:min(100%,calc(44vh * var(--ar)));max-width:min(100%,calc(44dvh * var(--ar)));height:auto;border-radius:10px;background:var(--surface);border:1px solid var(--line);touch-action:pan-y}
.app[data-mode="accuse"] .map svg{max-width:min(100%,calc(33vh * var(--ar)));max-width:min(100%,calc(33dvh * var(--ar)))}
.map svg *{pointer-events:none}
.floor{fill:var(--surface)}
.wall{stroke:var(--ink);stroke-width:5;stroke-linecap:square;fill:none}
.door{stroke:var(--green);stroke-width:2;stroke-dasharray:3 3;fill:none}
.doors-hot .door{stroke-width:5;stroke-dasharray:none;animation:blink 1.1s ease-in-out infinite}
.rname{fill:var(--ink);font-family:var(--f-display);font-size:17px;font-weight:700}
.small{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.body{stroke:var(--red);stroke-width:2;fill:none;transition:opacity .6s}
.map .hit{pointer-events:all;fill:var(--surface);fill-opacity:0;cursor:pointer;transition:fill-opacity .2s}
.hit.reach{fill:var(--green);fill-opacity:.16}
.hit.dim{fill:var(--ink);fill-opacity:.08;cursor:not-allowed}
.hit.nudge{fill:var(--green);animation:fillblink 1.1s ease-in-out infinite}
.hit.crime{fill:var(--red);animation:fillblink 1.1s ease-in-out infinite}
@keyframes fillblink{0%,100%{fill-opacity:.12}50%{fill-opacity:.38}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.map .hit:focus,.map .mk:focus{outline:none}
.hit:focus-visible{stroke:var(--green);stroke-width:3}
.mk:focus-visible .dotc{stroke:var(--green);stroke-width:3}
.map .mk{pointer-events:all;cursor:pointer}
.mk .tap{fill:transparent}
.mk .dotc{fill:var(--yellow)}
.mk text{fill:var(--on-mark);font-family:var(--f-mono);font-size:12px;font-weight:500}
.mk .ring{fill:none;stroke:var(--yellow);stroke-width:3;opacity:0}
.mk.focus .ring{opacity:1;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{r:12;opacity:1}to{r:26;opacity:0}}
.mk.used .dotc{fill:var(--muted)}
.app[data-mode="ending"] .mk,.app[data-mode="intro"] .mk{display:none}
.tok circle{stroke:var(--surface);stroke-width:3}
.tok text{fill:var(--on-token);font-family:var(--f-display);font-size:20px;font-weight:800}
.tok{transition:opacity .2s}
.tok.sel circle{stroke:var(--ink);stroke-width:4}
.trail{fill:none;stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;opacity:.8}
.clockface circle{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.clockface line{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.clockface text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.clockface.stopped circle{stroke:var(--red)}
.clockface.stopped text{fill:var(--red)}

/* Personer */
.tray{display:grid;grid-template-columns:repeat(var(--tray-cols),1fr);gap:6px}
.app[data-mode="accuse"] .tray,.app[data-mode="ending"] .tray{display:none}
.tbtn{display:flex;align-items:center;gap:5px;padding:4px 6px 4px 4px;border-radius:999px;border:1px dashed var(--line);background:var(--surface);cursor:pointer;min-width:0;text-align:left}
.tbtn .dot{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--on-token);font:800 .85rem var(--f-display)}
.tbtn .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.tbtn b{font-size:.82rem;font-weight:600;line-height:1}
.tbtn .dots{display:flex;gap:3px}
.tbtn .dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)}
.tbtn .dots i.on{background:var(--ink);border-color:var(--ink)}
.tbtn .dots i.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--muted)}
.tbtn.placed{border-style:solid;border-color:var(--muted)}
.tbtn[aria-pressed="true"]{border-style:solid;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tbtn:disabled{cursor:default}
.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 5px var(--glow)}}

/* Felt under kartet: ett panel per modus */
.panel{display:none;flex:1 1 0;min-height:0;flex-direction:column;gap:8px}
.app[data-mode="intro"] #pIntro,.app[data-mode="investigate"] #pInv,.app[data-mode="accuse"] #pAcc,.app[data-mode="ending"] #pEnd,.app[data-mode="error"] #pErr{display:flex}
.caprow{display:flex;align-items:flex-start;gap:8px;min-height:2.6em}
.caption{flex:1;font:500 .78rem var(--f-mono);color:var(--muted);line-height:1.3}
.mini{flex:0 0 auto;font:600 .8rem var(--f-body);padding:5px 10px;border-radius:8px;border:1px solid var(--red);color:var(--red);background:transparent;cursor:pointer}

/* Notater: person × time */
.notes{width:100%;border-collapse:collapse;font:500 .72rem var(--f-mono);table-layout:fixed}
.notes th{font-weight:500;color:var(--muted);padding:2px 4px;text-align:left}
.notes th.cur{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.notes td{padding:1px}
.notes td.name{width:22%;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notes td.name span{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.nc{width:100%;font:inherit;padding:4px 2px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc.empty{color:var(--muted);border-style:dashed;background:transparent}

/* Ledetråder */
.clues{flex:1 1 0;min-height:72px;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);padding-top:6px}
.clues h2{font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 6px}
.clues ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clue{display:flex;gap:8px;align-items:flex-start;padding:8px 6px 8px 10px;border-radius:8px;border:1px solid transparent;background:var(--surface);font-size:.9rem;cursor:pointer;transition:background .2s,border-color .2s}
.clue .n{font:500 .85rem var(--f-mono);color:var(--yellow);flex:0 0 auto;padding-top:1px}
.clue .t{flex:1}
.clue .lead{display:block;font-size:.8rem;color:var(--muted);font-style:italic;margin-bottom:2px}
.clue.focus{border-color:var(--yellow)}
.clue.new{animation:arrive .35s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}}
.clue.used{order:1;opacity:.5}
.clue.used .t{text-decoration:line-through;text-decoration-thickness:1px}
.done{flex:0 0 32px;height:32px;margin:-4px 0;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.85rem;color:var(--muted)}
.clue.used .done{background:var(--green);border-color:var(--green);color:var(--on-mark)}
.more{display:flex;gap:8px;align-items:center;padding:8px 0 10px}
.more .btn{flex:1;padding:9px 12px;font-size:.92rem}
.link{background:none;border:0;padding:8px 4px;font:500 .78rem var(--f-mono);color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Knapper */
.btn{font:600 1rem var(--f-body);padding:13px 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;width:100%}
.btn small{display:block;font:500 .68rem var(--f-mono);opacity:.75;margin-top:2px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}

/* Intro og avslutning: historien i stor tekst */
.story{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.story h2{font-size:1.5rem;font-weight:800}
.story .big{font:500 1.2rem/1.35 var(--f-display)}
.story .lede{font-size:1rem;color:var(--ink)}
.step{font:500 .72rem var(--f-mono);color:var(--muted);letter-spacing:.06em}
.foot{display:flex;gap:8px;align-items:center}

/* Anklage */
#pAcc{overflow-y:auto;gap:6px}
.q{font-size:.88rem;color:var(--muted)}
.pick{display:grid;gap:6px}
#pickS{grid-template-columns:repeat(var(--pick-s),1fr)}
#pickR{grid-template-columns:repeat(var(--pick-r),1fr)}
.pbtn{font:600 .82rem var(--f-body);padding:9px 2px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{font-weight:600;font-size:.92rem}
.msg:empty{display:none}
.share-text{font-family:var(--f-mono);font-size:.9rem;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;user-select:all}

@media (max-height:700px){
  .app{gap:6px}
  .map svg{max-width:min(100%,calc(38dvh * var(--ar)))}
  .app[data-mode="accuse"] .map svg{max-width:min(100%,calc(28dvh * var(--ar)))}
  .hour{padding:5px 0}
  .btn#openAcc{padding:9px 18px}
  #pAcc .btn{padding:9px 12px}
  #pAcc .nc{padding:2px}
  .pbtn{padding:7px 2px}
  .story h2{font-size:1.25rem}
  .story .big{font-size:1.05rem}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>
<main class="app" id="app" data-mode="loading">
  <header class="top">
    <h1 id="title"></h1>
    <span class="status" id="status">0:00</span>
    <button class="pill" type="button" id="notesBtn" aria-pressed="false" aria-controls="notesInv">Notes</button>
    <button class="icon" type="button" id="helpBtn" aria-label="How to play">?</button>
  </header>

  <div class="hours" id="hours" role="group" aria-label="Time"></div>

  <div class="map"><svg id="svg" viewBox="14 14 372 372"></svg></div>

  <div class="tray" id="tray" role="group" aria-label="Suspects"></div>

  <!-- Intro: åpningsscenen, ett steg om gangen, med kartet synlig -->
  <section class="panel" id="pIntro" aria-live="polite">
    <div class="story">
      <span class="step" id="introN"></span>
      <h2 id="introH"></h2>
      <p class="lede" id="introT"></p>
    </div>
    <div class="foot">
      <button class="link" type="button" id="introSkip">Skip</button>
      <button class="btn" type="button" id="introNext">Continue</button>
    </div>
  </section>

  <!-- Etterforskning -->
  <section class="panel" id="pInv">
    <div class="caprow">
      <p class="caption" id="cap" aria-live="polite">Pick a person, then tap a room.</p>
      <button class="mini" type="button" id="rm" hidden>Remove</button>
    </div>
    <table class="notes" id="notesInv" hidden aria-label="Your notes"></table>
    <section class="clues" aria-label="Evidence">
      <h2>Evidence · tap to find on the map</h2>
      <ol id="clueList"></ol>
      <div class="more" id="more">
        <button class="btn ghost" type="button" id="nextClue">Next finding</button>
        <button class="link" type="button" id="showAll">Show all</button>
      </div>
    </section>
    <button class="btn" type="button" id="openAcc">Make your accusation<small>You don’t need to fill in every room</small></button>
  </section>

  <!-- Anklage: kartet og notatene er synlige -->
  <section class="panel" id="pAcc">
    <table class="notes" id="notesAcc" aria-label="Your notes"></table>
    <span class="q" id="qS"></span>
    <div class="pick" id="pickS"></div>
    <span class="q" id="qR"></span>
    <div class="pick" id="pickR"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="row">
      <button class="btn ghost" type="button" id="backInv">Back</button>
      <button class="btn" type="button" id="accuse">Accuse</button>
    </div>
  </section>

  <!-- Avslutning: natten fortelles steg for steg i spillerens tempo -->
  <section class="panel" id="pEnd">
    <div class="story" id="endStory" aria-live="polite">
      <span class="step" id="storyN"></span>
      <p class="big" id="storyT"></p>
    </div>
    <button class="btn" type="button" id="storyNext">Next</button>
    <div class="story" id="endResult" hidden>
      <h2>Case closed</h2>
      <p class="lede" id="closing"></p>
      <pre class="share-text" id="shareText"></pre>
      <div class="row">
        <button class="btn" type="button" id="copy">Copy result</button>
        <button class="btn ghost" type="button" id="replayBtn">Replay the night</button>
      </div>
    </div>
  </section>

  <!-- Ukjent sak eller feil i dataene -->
  <section class="panel" id="pErr" role="alert">
    <div class="story">
      <h2 id="errH">This case could not be opened</h2>
      <p class="lede" id="errT"></p>
      <p class="lede"><a href="./">Open today’s case</a></p>
    </div>
  </section>
</main>

<script type="module">
import { validateFloorplan, layout, decorate, doorPoint, nameFontSize } from './lib/floorplan.js';

var $ = function(id){ return document.getElementById(id); };
var app = $('app');
var NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text){
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  for (var k in (attrs || {})){ if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function(c){ e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function fail(title, text){
  $('title').textContent = 'Daily case';
  $('errH').textContent = title; $('errT').textContent = text;
  app.dataset.mode = 'error';
}
async function getJson(url){
  var res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw Object.assign(new Error('HTTP ' + res.status), { status: res.status });
  return res.json();
}

(async function(){
  var id = new URLSearchParams(location.search).get('case');
  if (!id){ fail('No case chosen', 'The address needs a case, for example play.html?case=003.'); return; }
  if (!/^[A-Za-z0-9-]{1,40}$/.test(id)){ fail('Unknown case', 'There is no case with that name.'); return; }
  var c, plan;
  try { c = await getJson('cases/' + id + '.json'); }
  catch (e){
    if (e.status === 404) fail('Unknown case', 'There is no case “' + id + '”.');
    else fail('This case could not be opened', 'The case file could not be read. Try again in a moment.');
    return;
  }
  try {
    if (!c || typeof c.floorplan !== 'string' || !/^[A-Za-z0-9-]+$/.test(c.floorplan)) throw new Error('no floor plan');
    plan = await getJson('floorplans/' + c.floorplan + '.json');
    var bad = validateFloorplan(plan);
    if (bad.length) throw new Error(bad[0]);
    start(c, plan);
  } catch (e){
    if (window.console) console.error(e);
    fail('This case could not be opened', 'Case “' + id + '” has an error in its data.');
  }
})();

function start(c, plan){
  // --- Data fra saken ---
  var P = c.suspects.map(function(s){ return s.id; });
  var NM = {}, COL = {}, LET = {};
  c.suspects.forEach(function(s, i){
    NM[s.id] = s.name; COL[s.id] = 'var(--p-' + 'abcdef'[i] + ')';
    LET[s.id] = s.id.length <= 2 ? s.id : s.name.charAt(0);
  });
  var ROOMS = c.rooms.map(function(r){ return r.id; });
  var RN = {}, RS = {}, SLOT = {};
  c.rooms.forEach(function(r){ RN[r.id] = r.name; RS[r.id] = r.short || r.name; SLOT[r.id] = r.slot; });
  var ADJ = {}; ROOMS.forEach(function(r){ ADJ[r] = [r]; });
  c.doors.forEach(function(d){ ADJ[d[0]].push(d[1]); ADJ[d[1]].push(d[0]); });
  var HRS = c.times, T = HRS.length, NP = P.length;
  var MI = HRS.indexOf(c.murder.time), MROOM = c.murder.room;
  var SOLV = c.solution;
  var CLUES = c.clues, NC = CLUES.length;
  var INTRO = c.intro, STORY = c.ending;
  var CQ = c.controlQuestions.filter(function(q){ return q.forAccused === undefined; })[0];
  var CQH = HRS.indexOf(CQ.time);
  var KILLER = P.filter(function(p){ return SOLV[p][MI] === MROOM; })[0];

  function picker(pid, set){
    var bs = all('#' + pid + ' .pbtn');
    bs.forEach(function(b){ b.addEventListener('click', function(){ if (solved) return; set(b.dataset.v); bs.forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }); });
  }
  picker('pickS', function(v){ pickS = v; });
  picker('pickR', function(v){ pickR = v; });
  $('accuse').addEventListener('click', function(){
    if (solved) return;
    startT();
    if (!pickS || !pickR){ msg.textContent = 'Choose a suspect and say where ' + NM[CQ.person] + ' was at ' + CQ.time + '.'; return; }
    if (pickS === ANSWER.suspect && pickR === ANSWER.room){
      solved = true; clearInterval(tmr); tick();
      var res = ''; for (var i = 0; i < strikes; i++) res += '🟥'; res += '🟩';
      $('shareText').textContent = c.share.title + ' · Case #' + c.share.number + '\n⏱ ' + fmt(secs()) + '\n' + res;
      startEnding();
    } else {
      strikes++; tick();
      msg.textContent = 'That doesn’t hold up. Strike ' + strikes + '.';
    }
  });

  // Avslutning: spilleren trykker seg gjennom natten. Partallssteg er et tidspunkt, oddetallssteg en forflytning.
  function showStep(){
    $('storyN').textContent = (eStep + 1) + ' / ' + STORY.length;
    $('storyT').textContent = STORY[eStep];
    storyNext.textContent = eStep < STORY.length - 1 ? 'Next' : 'See your result';
  }
  function clockAt(ti){
    if (ti < MI){ clock.classList.remove('stopped'); clockT.textContent = HRS[ti]; body.style.opacity = 0; }
    else if (ti === MI){ clock.classList.add('stopped'); clockT.textContent = HRS[MI]; body.style.opacity = 1; }
  }
  function startEnding(){
    animId++; busy = false; sel = null; guide = null;
    P.forEach(function(p){ place[p] = SOLV[p].slice(); });
    hour = 0; eStep = 0;
    clockAt(0);
    $('endStory').hidden = false; storyNext.hidden = false; $('endResult').hidden = true;
    showStep(); setMode('ending'); still();
  }
  function stroll(hh){ busy = true; ui(); walk(hh, function(){ busy = false; ui(); }, 1100); }
  storyNext.addEventListener('click', function(){
    if (busy) return;
    if (eStep === STORY.length - 1){ $('endStory').hidden = true; storyNext.hidden = true; $('endResult').hidden = false; return; }
    eStep++; showStep();
    if (eStep % 2 === 1) stroll((eStep + 1) / 2); else clockAt(eStep / 2);
  });
  $('replayBtn').addEventListener('click', startEnding);
  $('copy').addEventListener('click', function(){
    var box = $('shareText'), t = box.textContent, btn = this;
    function selc(){ var r = document.createRange(); r.selectNodeContents(box); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected, copy manually'; }
    try { navigator.clipboard.writeText(t).then(function(){ btn.textContent = 'Copied'; }, selc); } catch(e){ selc(); }
  });

  // Start: åpningsscenen første gang, ellers rett til første funn
  var seen = false; try { seen = localStorage.getItem(KEY) === '1' || localStorage.getItem(OLDKEY) === '1'; } catch(e){}
  still(); moreUi();
  if (seen) endIntro(); else { app.dataset.mode = 'intro'; showIntro(0); }
}
</script>
